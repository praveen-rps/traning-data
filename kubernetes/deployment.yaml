apiVersion: apps/v1
kind: Deployment
metadata:
  name: angularrestdemo
spec:
  replicas: 2   # scale to 2 pods
  selector:
    matchLabels:
      app: angularrestdemo
  template:
    metadata:
      labels:
        app: angularrestdemo
    spec:
      containers:
        - name: angularrestdemo
          image: angularrestdemoimage:latest
          imagePullPolicy: IfNotPresent
          # If your container serves on a different port (e.g., 4200), change this:
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: angularrestdemo-svc
spec:
  selector:
    app: angularrestdemo
  ports:
    - protocol: TCP
      port: 80        # service port
      targetPort: 80  # must match containerPort above
      nodePort: 30080 # choose any free port in 30000-32767
  type: NodePort
