<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <title>Travel Management - Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="container">
    <div class="logo">RPS TravelMate</div>
    <ul>
      <li><a href="index.html" class="active">Login</a></li>
      <li><a href="register.html">Register</a></li>
      <li><a href="packages.html">Tour Packages</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="card" style="max-width:500px; margin: auto;">
      <h2>Login</h2>
      <p>Welcome back! Please login to continue.</p>
      <form onsubmit="return validateLogin()">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="********" required />
        </div>
       <button type="button" class="btn btn-danger">Success</button>
        <p style="margin-top: 0.5rem;">New user? <a href="register.html">Register here</a></p>
      </form>
    </div>
  </div>

  <footer>
    &copy; 2025 RPS TravelMate. All rights reserved.
  </footer>

  <script>
    function validateLogin() {
      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('password').value.trim();
      if (!email || !pwd) {
        alert('Please fill both fields.');
        return false;
      }
      // Simulate success
      alert('Login successful (demo).');
      return false; // prevent actual submission for demo
    }
  </script>
</body>
</html>
