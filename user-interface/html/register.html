<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RPS Travel Management - Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="container">
    <div class="logo">RPS TravelMate</div>
    <ul>
      <li><a href="index.html">Login</a></li>
      <li><a href="register.html" class="active">Register</a></li>
      <li><a href="packages.html">Tour Packages</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="card" style="max-width:600px; margin: auto;">
      <h2>New User Registration</h2>
      <p>Create your account to start exploring tours.</p>
      <form onsubmit="return validateRegister()">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label for="email2">Email</label>
          <input type="email" id="email2" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password2">Password</label>
          <input type="password" id="password2" placeholder="********" required />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" placeholder="********" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" placeholder="+91 9876543210" />
        </div>
        <button type="submit">Register</button>
        <p style="margin-top: 0.5rem;">Already have an account? <a href="index.html">Login</a></p>
      </form>
    </div>
  </div>

  <footer>
    &copy; 2025 RPS TravelMate. All rights reserved.
  </footer>

  <script>
    function validateRegister() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email2').value.trim();
      const pwd = document.getElementById('password2').value;
      const confirm = document.getElementById('confirm').value;
      if (!name || !email || !pwd || !confirm) {
        alert('Please fill all required fields.');
        return false;
      }
      if (pwd !== confirm) {
        alert('Passwords do not match.');
        return false;
      }
      alert('Registration successful (demo).');
      return false;
    }
  </script>
</body>
</html>
