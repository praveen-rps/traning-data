<html>
    <body>
        <table border="1">
            <tr>
                <th>Employee Id</th>
                <th>Employee Name</th>
                <th>Department</th>
            </tr>
            {% for emp in employees %}
            <tr>
                <td>{{emp.empid}}</td>
                <td>{{emp.name}}</td>
                <td>{{emp.dept}}</td>
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
